<section id="contacts" class="section">
    <p class="kicker" data-i18n="contactsKicker">Контакты</p>
    <h2 class="title" data-i18n="contactsTitle">Как с нами связаться</h2>
    <p class="lead" data-i18n="contactsLead"></p>

    <!-- Замените эти данные на свои -->
    <div class="contacts-grid" id="social">
      <div>
        <div class="label" data-i18n="phoneLabel">Телефон</div>
        <div class="value" data-fill="phone">+380 00 000 00 00</div>
        <p class="note" data-i18n="phoneNote"></p>
      </div>
      <div>
        <div class="label" data-i18n="addrLabel">Адрес кухни</div>
        <div class="value" data-i18n="addrValue">ул. Примерная, 1</div>
        <p class="note" data-i18n="addrNote"></p>
      </div>
      <div>
        <div class="label" data-i18n="mailLabel">Почта</div>
        <div class="value">hello@yanasushi.example</div>
        <p class="note" data-i18n="mailNote"></p>
      </div>
    </div>

    <div class="delivery-box" id="delivery">
      <div><strong data-fill="time">45–60 мин</strong><span data-i18n="delTime">время доставки</span></div>
      <div><strong data-fill="fee">60</strong><span data-i18n="delFee">стоимость доставки</span></div>
      <div><strong data-fill="freeFrom">800</strong><span data-i18n="delFree">бесплатно при заказе от этой суммы</span></div>
      <div><strong data-i18n="delLastVal">до 22:30</strong><span data-i18n="delLast">последний приём заказов</span></div>
    </div>
  </section>
